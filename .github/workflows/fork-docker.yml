name: Fork Docker Image

# Fork-only workflow. Deliberately a NEW file rather than an edit to
# release_docker.yml: a file upstream does not have can never produce a rebase
# conflict, while release_docker.yml changes fairly often (pinned action SHAs,
# platform list, Go version).
#
# Differences from upstream on purpose:
#   - linux/amd64 only (the target NAS is x86_64); upstream builds 8 platforms
#   - GHCR only; upstream also pushes Docker Hub, which needs a secret a fork
#     does not have and whose login step has no fork guard
#   - self-contained Dockerfile instead of Dockerfile.ci, so there is no
#   - patches the frontend bundle with the StrmSync translations, which the
#     upstream image has no reason to carry
#     cross-compile + artifact-passing stage to replicate
#
# The frontend comes from upstream for free: build.sh defaults FRONTEND_REPO to
# OpenListTeam/OpenList-Frontend.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. fork-v1.0.0). Defaults to "latest" only.'
        required: false
        type: string
  push:
    tags:
      - 'fork-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image name
        # GHCR rejects uppercase characters in the repository path.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/openlist" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=openlist
            org.opencontainers.image.description=OpenList fork with scheduled strm scanning

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
